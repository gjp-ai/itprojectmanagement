<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UOB IT PMO — Kanban</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://formsubmit.co; base-uri 'none'; form-action 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23450a0a'/%3E%3Crect x='6' y='8' width='6' height='18' rx='1.5' fill='%23ffffff'/%3E%3Crect x='14' y='13' width='6' height='13' rx='1.5' fill='%23ffffff' opacity='0.85'/%3E%3Crect x='22' y='6' width='6' height='20' rx='1.5' fill='%23ffffff' opacity='0.7'/%3E%3C/svg%3E">
<style>
  :root {
    --brand-900: #450a0a; --brand-800: #7f1d1d; --brand-700: #991b1b; --brand-600: #b91c1c; --brand-500: #dc2626; --brand-100: #fecaca; --brand-50: #fef2f2;
    --grey-900: #1f2933; --grey-700: #52606d; --grey-500: #829ab1; --grey-300: #d9e2ec; --grey-100: #f0f4f8; --white: #fff;
    --pri-critical: #c0322a; --pri-critical-bg: #fbe6e4;
    --pri-high: #b5720a; --pri-high-bg: #fdf1dc;
    --pri-medium: #1d4ed8; --pri-medium-bg: #dbeafe;
    --pri-low: #52606d; --pri-low-bg: #eef1f4;
    --overdue: #c0322a; --overdue-bg: #fbe6e4;
    --st-backlog: #64748b; --st-inprogress: #1d4ed8; --st-blocked: #c0322a; --st-done: #15803d;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius: 10px; --radius-card: 12px; --radius-modal: 18px;
    --shadow-card: 0 1px 2px rgba(31,41,51,.08); --shadow-modal: 0 20px 50px rgba(31,41,51,.3);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --lane-col-w: 250px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: var(--font); color: var(--grey-900); background: var(--grey-100); }
  :focus-visible { outline: 3px solid var(--brand-500); outline-offset: 2px; }
  button { font-family: inherit; cursor: pointer; }

  header.app-header { background: var(--brand-900); color: var(--white); padding: var(--space-4) var(--space-5); }
  .header-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .wordmark { font-size: 1.2rem; font-weight: 800; }
  .wordmark small { display: block; font-size: 0.68rem; font-weight: 400; color: var(--brand-100); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .btn-add-task { background: var(--white); color: var(--brand-900); border: none; border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-weight: 700; font-size: 0.9rem; }
  .btn-add-task:hover { background: var(--brand-100); }
  .demo-note { font-size: 0.74rem; color: var(--brand-100); margin: var(--space-2) 0 0; }
  .summary-strip { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-3); }
  .summary-pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: var(--radius); padding: 4px var(--space-3); font-size: 0.8rem; display: flex; gap: 6px; align-items: baseline; }
  .summary-pill strong { font-size: 0.95rem; }
  .summary-pill.overdue { border-color: var(--pri-critical); background: rgba(192,50,42,.25); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3); background: var(--white); border-bottom: 1px solid var(--grey-300); padding: var(--space-3) var(--space-5); }
  .filter-field { display: flex; flex-direction: column; gap: 2px; min-width: 160px; }
  .filter-field label { font-size: 0.7rem; font-weight: 700; color: var(--grey-700); text-transform: uppercase; }
  select, input[type="text"], input[type="date"], textarea { font-family: inherit; font-size: 0.85rem; padding: 6px var(--space-3); border: 1px solid var(--grey-300); border-radius: var(--radius); background: var(--white); color: var(--grey-900); }
  .btn-clear-filters { background: var(--grey-100); border: 1px solid var(--grey-300); border-radius: var(--radius); padding: 7px var(--space-3); font-size: 0.8rem; color: var(--grey-700); }
  .btn-clear-filters:hover { background: var(--grey-300); }

  .lanes-wrapper { overflow-x: auto; padding: var(--space-5); }
  .lanes { display: grid; grid-template-columns: 170px repeat(4, var(--lane-col-w)); min-width: 1200px; border: 1px solid var(--grey-300); border-radius: var(--radius); overflow: hidden; background: var(--white); }

  .status-col-header { position: sticky; top: 0; background: var(--grey-100); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: var(--space-3); border-bottom: 2px solid var(--grey-300); border-left: 1px solid var(--grey-300); color: var(--grey-700); display: flex; align-items: center; gap: 6px; }
  .status-col-header:first-child { border-left: none; }
  .status-col-header .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .status-col-header[data-status="Backlog"] .dot { background: var(--st-backlog); }
  .status-col-header[data-status="In Progress"] .dot { background: var(--st-inprogress); }
  .status-col-header[data-status="Blocked"] .dot { background: var(--st-blocked); }
  .status-col-header[data-status="Done"] .dot { background: var(--st-done); }
  .corner-header { background: var(--brand-900); color: var(--white); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: var(--space-3); display: flex; align-items: center; }

  .lane-label { background: var(--grey-100); border-top: 1px solid var(--grey-300); padding: var(--space-3); font-size: 0.78rem; font-weight: 700; color: var(--grey-900); display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .lane-label .lane-count { font-size: 0.68rem; font-weight: 600; color: var(--grey-500); text-transform: none; letter-spacing: 0; }

  .lane-cell { border-top: 1px solid var(--grey-300); border-left: 1px solid var(--grey-300); padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); min-height: 90px; }
  .lane-cell.drag-over { background: var(--brand-50); outline: 2px dashed var(--brand-500); outline-offset: -2px; }
  .lane-cell-empty { font-size: 0.7rem; color: var(--grey-500); text-align: center; padding: var(--space-3) var(--space-1); border: 1px dashed var(--grey-300); border-radius: var(--radius); }

  .card { background: var(--white); border: 1px solid var(--grey-300); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: var(--space-2) var(--space-3); border-left: 3px solid var(--grey-300); cursor: grab; }
  .card:hover { border-color: var(--grey-500); }
  .card:active { cursor: grabbing; }
  .card.priority-critical { border-left-color: var(--pri-critical); }
  .card.priority-high { border-left-color: var(--pri-high); }
  .card.priority-medium { border-left-color: var(--pri-medium); }
  .card.priority-low { border-left-color: var(--pri-low); }
  .card-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.6rem; color: var(--grey-500); font-weight: 600; }
  .card-title { font-size: 0.8rem; font-weight: 700; line-height: 1.3; margin: 2px 0 6px; color: var(--grey-900); }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.68rem; color: var(--grey-700); margin-bottom: 6px; align-items: center; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 999px; background: var(--brand-100); color: var(--brand-800); font-size: 0.55rem; font-weight: 800; flex-shrink: 0; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .priority-pill { display: inline-flex; align-items: center; font-size: 0.6rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; }
  .priority-pill.priority-critical { color: var(--pri-critical); background: var(--pri-critical-bg); }
  .priority-pill.priority-high { color: var(--pri-high); background: var(--pri-high-bg); }
  .priority-pill.priority-medium { color: var(--pri-medium); background: var(--pri-medium-bg); }
  .priority-pill.priority-low { color: var(--pri-low); background: var(--pri-low-bg); }
  .overdue-badge { display: inline-flex; align-items: center; font-size: 0.6rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--overdue-bg); color: var(--overdue); }
  .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--grey-100); }
  .move-control { font-size: 0.66rem; }
  .move-control select { padding: 1px 4px; font-size: 0.66rem; }
  .btn-delete { background: transparent; border: 1px solid var(--grey-300); border-radius: 6px; color: var(--grey-700); width: 20px; height: 20px; font-size: 0.72rem; }
  .btn-delete:hover { background: var(--pri-critical-bg); color: var(--pri-critical); border-color: var(--pri-critical); }
  .delete-confirm { display: flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 700; }
  .btn-confirm-yes { background: var(--pri-critical); color: var(--white); border: none; border-radius: 6px; padding: 2px 7px; font-size: 0.64rem; }
  .btn-confirm-no { background: var(--grey-100); border: 1px solid var(--grey-300); border-radius: 6px; padding: 2px 7px; font-size: 0.64rem; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(31,41,51,.5); display: flex; align-items: flex-start; justify-content: center; padding: var(--space-6) var(--space-4); overflow-y: auto; z-index: 100; }
  .modal-backdrop[hidden] { display: none; }
  .modal { background: var(--white); border-radius: var(--radius-modal); box-shadow: var(--shadow-modal); max-width: 560px; width: 100%; padding: var(--space-5); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
  .modal-header h2 { margin: 0; color: var(--brand-900); font-size: 1.1rem; }
  .btn-close-modal { background: transparent; border: none; font-size: 1.3rem; color: var(--grey-700); width: 32px; height: 32px; border-radius: 6px; }
  .btn-close-modal:hover { background: var(--grey-100); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .form-field { display: flex; flex-direction: column; gap: var(--space-1); }
  .form-field.span-2 { grid-column: 1 / -1; }
  .form-field label { font-size: 0.8rem; font-weight: 700; color: var(--grey-900); }
  .field-error { font-size: 0.74rem; color: var(--pri-critical); min-height: 1em; }
  .form-actions { margin-top: var(--space-5); display: flex; justify-content: flex-end; gap: var(--space-3); }
  .btn-cancel { background: var(--white); border: 1px solid var(--grey-300); border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-weight: 700; color: var(--grey-700); }
  .btn-submit { background: var(--brand-600); border: none; border-radius: var(--radius); padding: var(--space-3) var(--space-4); font-weight: 700; color: var(--white); }
  .btn-submit:disabled { background: var(--grey-500); cursor: not-allowed; }
  .btn-submit:hover:not(:disabled) { background: var(--brand-700); }

  .toast-region { position: fixed; bottom: var(--space-5); right: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2); z-index: 200; max-width: 320px; }
  .toast { border-radius: var(--radius); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-card); font-size: 0.85rem; font-weight: 700; color: var(--white); }
  .toast.success { background: var(--st-done); }
  .toast.warning { background: var(--pri-high); }
  .toast.error { background: var(--pri-critical); }
</style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="wordmark">UOB IT PMO<small>Internal demo — Kanban board (swimlanes by project)</small></div>
      <button type="button" class="btn-add-task" id="openAddTaskBtn">+ Add Task</button>
    </div>
    <p class="demo-note">Demo data only — board state lives in memory and resets on page refresh. Drag a card into another lane to reassign its project.</p>
    <div class="summary-strip" id="summaryStrip" aria-live="polite"></div>
  </header>

  <div class="toolbar" aria-label="Filter tasks">
    <div class="filter-field">
      <label for="filterProject">Project</label>
      <select id="filterProject">
        <option value="">All projects</option>
        <option>Core Banking Upgrade</option><option>Digital Channels</option><option>Cybersecurity Uplift</option>
        <option>Data &amp; Analytics</option><option>Infrastructure &amp; Cloud</option><option>Vendor Management</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="filterAssignee">Assignee contains</label>
      <input type="text" id="filterAssignee" placeholder="e.g. Tan" maxlength="60" autocomplete="off">
    </div>
    <div class="filter-field">
      <label for="filterPriority">Priority</label>
      <select id="filterPriority">
        <option value="">All priorities</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
      </select>
    </div>
    <button type="button" class="btn-clear-filters" id="clearFiltersBtn">Clear filters</button>
  </div>

  <div class="lanes-wrapper">
    <div class="lanes" id="board" aria-label="Kanban board grouped by project"></div>
  </div>

  <div class="modal-backdrop" id="addTaskModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTaskModalTitle">
      <div class="modal-header">
        <h2 id="addTaskModalTitle">Add Task</h2>
        <button type="button" class="btn-close-modal" id="closeModalBtn" aria-label="Close add task dialog">&times;</button>
      </div>
      <form id="addTaskForm" novalidate>
        <div class="form-grid">
          <div class="form-field span-2">
            <label for="fieldTitle">Task Title</label>
            <input type="text" id="fieldTitle" maxlength="80">
            <span class="field-error" id="errorTitle"></span>
          </div>
          <div class="form-field span-2">
            <label for="fieldDescription">Description</label>
            <textarea id="fieldDescription" rows="3" maxlength="500"></textarea>
            <span class="field-error" id="errorDescription"></span>
          </div>
          <div class="form-field">
            <label for="fieldProject">Project / Workstream</label>
            <select id="fieldProject">
              <option>Core Banking Upgrade</option><option>Digital Channels</option><option>Cybersecurity Uplift</option>
              <option>Data &amp; Analytics</option><option>Infrastructure &amp; Cloud</option><option>Vendor Management</option>
            </select>
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label for="fieldCategory">Category</label>
            <select id="fieldCategory">
              <option>Application Development</option><option>Infrastructure</option><option>Cybersecurity</option>
              <option>Data</option><option>Compliance</option><option>Vendor</option>
            </select>
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label for="fieldAssignee">Assignee</label>
            <input type="text" id="fieldAssignee" maxlength="60" autocomplete="off">
            <span class="field-error" id="errorAssignee"></span>
          </div>
          <div class="form-field">
            <label for="fieldPriority">Priority</label>
            <select id="fieldPriority">
              <option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option>
            </select>
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label for="fieldDueDate">Due Date</label>
            <input type="date" id="fieldDueDate">
            <span class="field-error" id="errorDueDate"></span>
          </div>
          <div class="form-field">
            <label for="fieldStatus">Status</label>
            <select id="fieldStatus">
              <option>Backlog</option><option>In Progress</option><option>Blocked</option><option>Done</option>
            </select>
            <span class="field-error"></span>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelAddTaskBtn">Cancel</button>
          <button type="submit" class="btn-submit" id="submitAddTaskBtn">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

<script>
  "use strict";
  const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/ganjpaien@gmail.com";

  const COLUMNS = [
    { status: "Backlog", label: "Backlog" },
    { status: "In Progress", label: "In Progress" },
    { status: "Blocked", label: "Blocked" },
    { status: "Done", label: "Done" },
  ];
  const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];

  const state = { tasks: [], filters: { project: "", assignee: "", priority: "" }, nextIdCounter: 9 };
  const pendingDeleteIds = new Set();

  function seedTasks() {
    return [
      { id: "UOB-ITPM-0001", title: "Migrate FX pricing service to AWS", description: "Lift-and-shift the FX pricing microservice to the AWS landing zone ahead of the Q4 core banking cutover.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Wei Ling Tan", priority: "High", dueDate: "2026-09-25", status: "In Progress" },
      { id: "UOB-ITPM-0002", title: "Patch CVE-2025-41821 on branch teller VDI", description: "Apply vendor patch across all branch teller VDI images and validate via vulnerability scan.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Marcus Lim", priority: "Critical", dueDate: "2026-08-30", status: "Blocked" },
      { id: "UOB-ITPM-0003", title: "UAT sign-off for mobile onboarding release 4.2", description: "Coordinate UAT with business stakeholders and obtain formal sign-off before release.", project: "Digital Channels", category: "Application Development", assignee: "Priya Nair", priority: "High", dueDate: "2026-09-12", status: "In Progress" },
      { id: "UOB-ITPM-0004", title: "Decommission legacy MPLS circuits (APAC)", description: "Decommission redundant MPLS circuits after SD-WAN cutover confirmation.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Rahul Menon", priority: "Low", dueDate: "2026-10-15", status: "Backlog" },
      { id: "UOB-ITPM-0005", title: "Vendor risk assessment — payments gateway provider", description: "Complete annual vendor risk assessment questionnaire and evidence collection.", project: "Vendor Management", category: "Vendor", assignee: "Siti Aminah", priority: "Medium", dueDate: "2026-09-05", status: "Backlog" },
      { id: "UOB-ITPM-0006", title: "Build fraud-signal data pipeline v2", description: "Extend the streaming pipeline with two new fraud-signal features requested by Risk.", project: "Data & Analytics", category: "Data", assignee: "Jonathan Koh", priority: "Medium", dueDate: "2026-11-01", status: "In Progress" },
      { id: "UOB-ITPM-0007", title: "Quarterly access recertification — core banking", description: "Run and evidence the Q3 user access recertification for core banking systems.", project: "Core Banking Upgrade", category: "Compliance", assignee: "Grace Ho", priority: "High", dueDate: "2026-08-20", status: "Done" },
      { id: "UOB-ITPM-0008", title: "Retire on-prem log aggregator", description: "Cut over log shipping to the new SIEM platform and decommission the old aggregator.", project: "Cybersecurity Uplift", category: "Infrastructure", assignee: "Marcus Lim", priority: "Low", dueDate: "2026-07-30", status: "Done" },
    ];
  }
  state.tasks = seedTasks();

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }
  function todayIso() { return new Date().toISOString().slice(0, 10); }
  function isOverdue(task) { return task.status !== "Done" && task.dueDate < todayIso(); }
  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-SG", { year: "numeric", month: "short", day: "numeric" });
  }
  function priorityClass(priority) { return "priority-" + priority.toLowerCase(); }
  function getInitials(name) {
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function generateTaskId() { state.nextIdCounter += 1; return "UOB-ITPM-" + String(state.nextIdCounter).padStart(4, "0"); }
  function showToast(message, type) {
    const region = document.getElementById("toastRegion");
    const toast = document.createElement("div");
    toast.className = "toast " + (type || "success");
    toast.textContent = message;
    region.appendChild(toast);
    setTimeout(() => toast.remove(), 4500);
  }

  function applyFilters() {
    state.filters.project = document.getElementById("filterProject").value;
    state.filters.assignee = document.getElementById("filterAssignee").value.trim().toLowerCase();
    state.filters.priority = document.getElementById("filterPriority").value;
    renderBoard();
  }
  function getFilteredTasks() {
    return state.tasks.filter((task) => {
      if (state.filters.project && task.project !== state.filters.project) return false;
      if (state.filters.priority && task.priority !== state.filters.priority) return false;
      if (state.filters.assignee && !task.assignee.toLowerCase().includes(state.filters.assignee)) return false;
      return true;
    });
  }

  function renderSummary() {
    const total = state.tasks.length;
    const overdueCount = state.tasks.filter(isOverdue).length;
    const countsByStatus = {};
    COLUMNS.forEach((c) => { countsByStatus[c.status] = 0; });
    state.tasks.forEach((t) => { countsByStatus[t.status] = (countsByStatus[t.status] || 0) + 1; });
    const pills = [`<div class="summary-pill"><strong>${total}</strong><span>Total</span></div>`]
      .concat(COLUMNS.map((c) => `<div class="summary-pill"><strong>${countsByStatus[c.status]}</strong><span>${escapeHtml(c.label)}</span></div>`))
      .concat([`<div class="summary-pill overdue"><strong>${overdueCount}</strong><span>Overdue</span></div>`]);
    document.getElementById("summaryStrip").innerHTML = pills.join("");
  }

  function renderCard(task) {
    const overdue = isOverdue(task);
    const confirming = pendingDeleteIds.has(task.id);
    const moveOptions = COLUMNS.map((c) => `<option value="${escapeHtml(c.status)}" ${c.status === task.status ? "selected" : ""}>${escapeHtml(c.label)}</option>`).join("");
    const actionsHtml = confirming
      ? `<div class="delete-confirm"><span>Delete?</span>
           <button type="button" class="btn-confirm-yes" data-action="confirm-delete" data-id="${escapeHtml(task.id)}">Yes</button>
           <button type="button" class="btn-confirm-no" data-action="cancel-delete" data-id="${escapeHtml(task.id)}">No</button></div>`
      : `<div class="move-control">
           <select aria-label="Move task" data-action="move" data-id="${escapeHtml(task.id)}">${moveOptions}</select>
         </div>
         <button type="button" class="btn-delete" data-action="delete" data-id="${escapeHtml(task.id)}" aria-label="Delete task ${escapeHtml(task.id)}">&times;</button>`;
    return `
      <div class="card ${priorityClass(task.priority)}" draggable="true" data-id="${escapeHtml(task.id)}" tabindex="0">
        <span class="card-id">${escapeHtml(task.id)}</span>
        <p class="card-title">${escapeHtml(task.title)}</p>
        <div class="card-meta">
          <span class="avatar" aria-hidden="true">${escapeHtml(getInitials(task.assignee))}</span>${escapeHtml(task.assignee)}
          <span>· ${escapeHtml(formatDate(task.dueDate))}</span>
        </div>
        <div class="badge-row">
          <span class="priority-pill ${priorityClass(task.priority)}">${escapeHtml(task.priority)}</span>
          ${overdue ? '<span class="overdue-badge">Overdue</span>' : ""}
        </div>
        <div class="card-actions">${actionsHtml}</div>
      </div>`;
  }

  function renderBoard() {
    const board = document.getElementById("board");
    const filtered = getFilteredTasks();

    // Only show project lanes that still have at least one task overall
    // (keeps the grid from growing beyond what the demo data uses),
    // unless a project filter is active, in which case just that lane shows.
    const activeProjects = state.filters.project ? [state.filters.project] : PROJECTS;

    let html = `<div class="corner-header">Project</div>`;
    html += COLUMNS.map((c) => `<div class="status-col-header" data-status="${escapeHtml(c.status)}"><span class="dot"></span>${escapeHtml(c.label)}</div>`).join("");

    activeProjects.forEach((project) => {
      const projectTasks = filtered.filter((t) => t.project === project);
      const totalForProject = state.tasks.filter((t) => t.project === project).length;
      if (totalForProject === 0) return;

      html += `<div class="lane-label">${escapeHtml(project)}<span class="lane-count">${projectTasks.length} task${projectTasks.length === 1 ? "" : "s"}</span></div>`;
      html += COLUMNS.map((col) => {
        const cellTasks = projectTasks.filter((t) => t.status === col.status);
        const cardsHtml = cellTasks.length ? cellTasks.map(renderCard).join("") : `<div class="lane-cell-empty">—</div>`;
        return `<div class="lane-cell" data-status="${escapeHtml(col.status)}" data-project="${escapeHtml(project)}">${cardsHtml}</div>`;
      }).join("");
    });

    board.innerHTML = html;
    renderSummary();
    wireBoardEvents();
  }

  function moveTask(taskId, newStatus, newProject) {
    const task = state.tasks.find((t) => t.id === taskId);
    if (!task) return;
    task.status = newStatus;
    if (newProject) task.project = newProject;
    renderBoard();
  }
  function deleteTask(taskId) {
    state.tasks = state.tasks.filter((t) => t.id !== taskId);
    pendingDeleteIds.delete(taskId);
    renderBoard();
  }
  function addTask(taskData) {
    const task = { id: generateTaskId(), ...taskData };
    state.tasks.push(task);
    renderBoard();
    return task;
  }

  async function notifyNewTask(task) {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`, _template: "table", _captcha: "false",
        "Task ID": task.id, Title: task.title, Description: task.description, Project: task.project,
        Category: task.category, Assignee: task.assignee, Priority: task.priority, "Due Date": task.dueDate,
        Status: task.status, "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    return await res.json();
  }

  function clearFieldErrors() {
    ["errorTitle", "errorDescription", "errorAssignee", "errorDueDate"].forEach((id) => { document.getElementById(id).textContent = ""; });
  }
  function validateForm(fields) {
    const errors = {};
    if (!fields.title.trim()) errors.title = "Task title is required.";
    else if (fields.title.length > 80) errors.title = "Task title must be 80 characters or fewer.";
    if (fields.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
    if (!fields.assignee.trim()) errors.assignee = "Assignee is required.";
    else if (fields.assignee.length > 60) errors.assignee = "Assignee must be 60 characters or fewer.";
    if (!fields.dueDate) errors.dueDate = "Due date is required.";
    else if (fields.dueDate < todayIso()) errors.dueDate = "Due date cannot be in the past.";
    return errors;
  }
  function displayFieldErrors(errors) {
    if (errors.title) document.getElementById("errorTitle").textContent = errors.title;
    if (errors.description) document.getElementById("errorDescription").textContent = errors.description;
    if (errors.assignee) document.getElementById("errorAssignee").textContent = errors.assignee;
    if (errors.dueDate) document.getElementById("errorDueDate").textContent = errors.dueDate;
  }

  function openModal() { document.getElementById("addTaskModal").hidden = false; document.getElementById("fieldTitle").focus(); }
  function closeModal() { document.getElementById("addTaskModal").hidden = true; document.getElementById("addTaskForm").reset(); clearFieldErrors(); }

  function wireBoardEvents() {
    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", card.dataset.id); e.dataTransfer.effectAllowed = "move"; });
    });
    document.querySelectorAll('[data-action="move"]').forEach((select) => {
      select.addEventListener("change", (e) => moveTask(e.target.dataset.id, e.target.value));
    });
    document.querySelectorAll('[data-action="delete"]').forEach((btn) => {
      btn.addEventListener("click", (e) => { pendingDeleteIds.add(e.currentTarget.dataset.id); renderBoard(); });
    });
    document.querySelectorAll('[data-action="confirm-delete"]').forEach((btn) => {
      btn.addEventListener("click", (e) => deleteTask(e.currentTarget.dataset.id));
    });
    document.querySelectorAll('[data-action="cancel-delete"]').forEach((btn) => {
      btn.addEventListener("click", (e) => { pendingDeleteIds.delete(e.currentTarget.dataset.id); renderBoard(); });
    });
    document.querySelectorAll(".lane-cell").forEach((cell) => {
      cell.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; cell.classList.add("drag-over"); });
      cell.addEventListener("dragleave", (e) => { if (!cell.contains(e.relatedTarget)) cell.classList.remove("drag-over"); });
      cell.addEventListener("drop", (e) => {
        e.preventDefault(); cell.classList.remove("drag-over");
        const taskId = e.dataTransfer.getData("text/plain");
        const newStatus = cell.dataset.status;
        const newProject = cell.dataset.project;
        if (taskId && newStatus) moveTask(taskId, newStatus, newProject);
      });
    });
  }

  function wireStaticEvents() {
    document.getElementById("filterProject").addEventListener("change", applyFilters);
    document.getElementById("filterAssignee").addEventListener("input", applyFilters);
    document.getElementById("filterPriority").addEventListener("change", applyFilters);
    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
      document.getElementById("filterProject").value = "";
      document.getElementById("filterAssignee").value = "";
      document.getElementById("filterPriority").value = "";
      applyFilters();
    });
    document.getElementById("openAddTaskBtn").addEventListener("click", openModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("cancelAddTaskBtn").addEventListener("click", closeModal);
    document.getElementById("addTaskModal").addEventListener("click", (e) => { if (e.target.id === "addTaskModal") closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("addTaskModal").hidden) closeModal(); });
    document.getElementById("addTaskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearFieldErrors();
      const fields = {
        title: document.getElementById("fieldTitle").value,
        description: document.getElementById("fieldDescription").value,
        project: document.getElementById("fieldProject").value,
        category: document.getElementById("fieldCategory").value,
        assignee: document.getElementById("fieldAssignee").value,
        priority: document.getElementById("fieldPriority").value,
        dueDate: document.getElementById("fieldDueDate").value,
        status: document.getElementById("fieldStatus").value,
      };
      const errors = validateForm(fields);
      if (Object.keys(errors).length > 0) { displayFieldErrors(errors); return; }
      const submitBtn = document.getElementById("submitAddTaskBtn");
      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = "Sending…";
      const task = addTask(fields);
      closeModal();
      showToast(`Task ${task.id} added.`, "success");
      try { await notifyNewTask(task); }
      catch (err) { showToast("Card added locally — email notification failed.", "warning"); }
      finally { submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
    });
  }

  wireStaticEvents();
  renderBoard();
</script>
</body>
</html>
